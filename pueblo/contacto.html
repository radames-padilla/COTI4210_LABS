<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="img/favicon2.png" type="image/png">
    <link rel="stylesheet" href="css/normalize.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&family=PT+Sans:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="culebra.css">

    <title>Contacto | Culebra, Puerto Rico</title>
</head>

<body>
    <header class="header header--contacto-video no-margin">
        <video autoplay muted loop playsinline class="header__video">
            <source src="audiovisual/video3.mp4" type="video/mp4">
        </video>

        <div class="header__contenido">
            <div class="contenedor">
                <div class="barra">
                    <a class="logo" href="index.html">
                        <h1 class="logo__nombre no-margin centrar-text">
                            Visita <span class="logo__bold">Culebra</span>
                        </h1>
                    </a>

                    <nav class="navegacion">
                        <a href="atractivos.html" class="enlace_nav">Playas</a>
                        <a href="experiencias.html" class="enlace_nav">Experiencias</a>
                        <a href="contacto.html" class="enlace_nav">Contacto</a>
                    </nav>
                </div>
            </div>

            <div class="header__text">
                <h2 class="no-margin">Contacto</h2>
            </div>
        </div>
    </header>

    <main class="contenedor contacto">
        <h3 class="centrar-text no-margin">Escríbenos</h3>

        <div class="contacto-bg"></div>

        <form class="formulario">
            <div class="campo">
                <input class="campo__field" type="text" placeholder="Nombre" id="nombre" name="nombre">
            </div>

            <div class="campo">
                <input class="campo__field" type="email" placeholder="E-mail" id="email" name="email">
            </div>

            <div class="campo">
                <textarea class="campo__field campo__field--textarea" placeholder="Mensaje" id="mensaje"
                    name="mensaje"></textarea>
            </div>

            <div class="campo">
                <input type="submit" value="Enviar" class="boton boton--primario">
            </div>
        </form>
    </main>

    <footer class="footer">
        <div class="no-padding contenedor">
            <div class="no-padding barra">
                <a class="logo" href="index.html">
                    <h1 class="logo__nombre no-margin centrar-text logo__bold">Culebra</h1>
                </a>

                <nav class="navegacion">
                    <a href="atractivos.html" class="enlace_nav">Playas</a>
                    <a href="experiencias.html" class="enlace_nav">Experiencias</a>
                    <a href="contacto.html" class="enlace_nav">Contacto</a>
                </nav>

                <ul class="social-menu no-padding">
                    <li><a href="https://facebook.com/" aria-label="Facebook"><i class="fab fa-facebook"></i></a></li>
                    <li><a href="https://twitter.com/" aria-label="Twitter"><i class="fab fa-twitter"></i></a></li>
                    <li><a href="https://instagram.com/" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                    </li>
                    <li><a href="https://youtube.com/" aria-label="YouTube"><i class="fab fa-youtube"></i></a></li>
                </ul>
            </div>
        </div>
    </footer>
</body>

</html>
